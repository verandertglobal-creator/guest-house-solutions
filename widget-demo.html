<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Guest House Portal | Yzerfontein</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent: #D97706;
            --accent-hover: #B45309;
            --accent-green: #10B981;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)),
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem 0.5rem;
        }

        .widget-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* Hero Accommodation Banner */
        .hero-banner {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 1.25rem;
            padding: 2rem 1rem 1.5rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.2) 0%, rgba(15, 23, 42, 0.92) 100%),
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }

        .hero-banner .badge {
            display: inline-block;
            background: rgba(217, 119, 6, 0.3);
            border: 1px solid var(--accent);
            color: #FDBA74;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .hero-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #FFF;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
            letter-spacing: 0.5px;
        }

        .guest-welcome-subtitle {
            font-size: 0.95rem;
            color: #FDBA74;
            font-weight: 600;
            margin-top: 0.3rem;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        .hero-banner p {
            font-size: 0.8rem;
            color: #E2E8F0;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
            margin-top: 0.2rem;
        }

        /* Event Detail Banner Image */
        .event-detail-banner {
            width: 100%;
            height: 160px;
            border-radius: 14px;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        /* Quick Check-In Bar */
        .checkin-bar {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid var(--accent-green);
            border-radius: 16px;
            padding: 0.9rem;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checkin-info h4 { font-size: 0.9rem; color: var(--accent-green); }
        .checkin-info p { font-size: 0.75rem; color: var(--text-muted); }

        .btn-checkin {
            background: var(--accent-green);
            color: #FFF;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-checkin:hover { opacity: 0.9; transform: scale(1.02); }

        /* Navigation Tabs */
        .tab-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem 0.3rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #FFF;
        }

        /* Tab Contents */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Buttons Grid */
        .widget-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem;
        }

        .widget-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem;
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .widget-btn:hover {
            background: rgba(217, 119, 6, 0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .widget-btn.full-width { grid-column: span 2; }
        .widget-btn.highlight { background: rgba(217, 119, 6, 0.2); border-color: var(--accent); }

        /* Event & Weather Cards */
        .list-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .list-card:hover {
            border-color: var(--accent);
            background: rgba(30, 41, 59, 0.9);
        }

        .badge-promoted {
            background: rgba(217, 119, 6, 0.25);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Modal Popup */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            justify-content: center; align-items: center; z-index: 1000; padding: 1rem;
        }

        .modal-content {
            background: #1E293B; border: 1px solid var(--border);
            border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 400px;
        }

        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 1rem;
            border-radius: 8px; border: 1px solid var(--border); background: #0F172A;
            color: #FFF; font-family: inherit;
        }

        .btn-submit {
            width: 100%; padding: 0.8rem; background: var(--accent);
            border: none; border-radius: 8px; color: #FFF; font-weight: 600; cursor: pointer;
        }

        .social-link-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 0.8rem; margin-bottom: 0.6rem; border-radius: 10px;
            text-decoration: none; font-weight: 600; color: #FFF; font-size: 0.85rem;
        }

        .footer-note { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 1.25rem; }
        .footer-note a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

    <div class="widget-container">
        <!-- Hero Accommodation Banner -->
        <div class="hero-banner">
            <span class="badge">West Coast Luxury</span>
            <h1>Yzerfontein Haven</h1>
            <div class="guest-welcome-subtitle" id="bannerWelcomeText">Welcome, Guest!</div>
            <p>Your West Coast digital portal.</p>
        </div>

        <!-- Check-In Banner -->
        <div class="checkin-bar" id="checkinBanner">
            <div class="checkin-info">
                <h4 id="checkinTitle">Check-In Arrival Log</h4>
                <p id="checkinTime">Tap to record arrival</p>
            </div>
            <button class="btn-checkin" id="checkinBtn" onclick="processCheckIn()">Check In</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('quick-access', event)">Services</button>
            <button class="tab-btn" onclick="switchTab('weather-tab', event)">7-Day Weather</button>
            <button class="tab-btn" onclick="switchTab('events-tab', event)">What To Do</button>
        </div>

        <!-- TAB 1: QUICK ACCESS SERVICES -->
        <div class="tab-content active" id="quick-access">
            <div class="widget-grid">
                <button class="widget-btn highlight full-width" onclick="openGateDemo()">
                    🔒 Open Main Gate (Remootio)
                </button>
                <button class="widget-btn" onclick="openModal('wifi')">
                    📶 Wi-Fi Access
                </button>
                <button class="widget-btn" onclick="openModal('breakfast')">
                    🍳 Order Breakfast
                </button>
                <button class="widget-btn" onclick="openModal('housekeeping')">
                    🧹 Housekeeping
                </button>
                <button class="widget-btn" onclick="openModal('loadshedding')">
                    ⚡ Power / Loadshedding
                </button>
                <button class="widget-btn" onclick="openModal('issue')">
                    🛠 Report Issue
                </button>
                <button class="widget-btn" onclick="openModal('manual')">
                    📖 House Manual
                </button>
                <button class="widget-btn" onclick="openModal('emergency')">
                    🚨 Emergency Info
                </button>
                <button class="widget-btn" onclick="openModal('checkout')">
                    🔑 Express Check-Out
                </button>
                <button class="widget-btn highlight full-width" onclick="openModal('socials')">
                    🌐 Our Social Media
                </button>
                <button class="widget-btn full-width" style="background: rgba(16, 185, 129, 0.2); border-color: var(--accent-green);" onclick="openWhatsApp()">
                    💬 Chat with Host (WhatsApp)
                </button>
            </div>
        </div>

        <!-- TAB 2: 7-DAY WEATHER -->
        <div class="tab-content" id="weather-tab">
            <div id="weatherList">Loading Yzerfontein Forecast...</div>
        </div>

        <!-- TAB 3: LOCAL EVENTS & WHAT TO DO -->
        <div class="tab-content" id="events-tab">
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem;">Select an option below for Yzerfontein & surrounds:</p>
            <div id="eventsList"></div>
        </div>

        <div class="footer-note">
            Powered by <a href="https://www.latskymultimedia.co.za" target="_blank">Latsky Multimedia</a>
        </div>
    </div>

    <!-- Generic Interactive Modal -->
    <div class="modal" id="actionModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom:1rem;">Service Request</h3>
            <div id="modalBody"></div>
            <button class="btn-submit" id="modalSubmitBtn" onclick="submitRequest()">Submit</button>
            <button style="background:transparent; border:none; color:var(--text-muted); width:100%; margin-top:0.6rem; cursor:pointer;" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const HOST_PHONE = "0027828215975";
        let guestName = "Guest";
        let roomNumber = "Your Room";

        // URL Parameter Processing
        function parseURLParameters() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('guest')) guestName = params.get('guest');
            if (params.has('room')) roomNumber = params.get('room');

            // Update UI elements with parsed parameters
            document.getElementById('bannerWelcomeText').innerText = `Welcome, ${guestName}! (${roomNumber})`;
            document.getElementById('checkinTitle').innerText = `${guestName} • ${roomNumber}`;

            // Trigger Welcome Modal Pop-up on load
            showWelcomeModal(guestName, roomNumber);
        }

        function showWelcomeModal(guest, room) {
            const modal = document.getElementById('actionModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const submitBtn = document.getElementById('modalSubmitBtn');

            title.innerText = `👋 Welcome to Yzerfontein Haven!`;
            submitBtn.style.display = "none";

            body.innerHTML = `
                <div style="text-align:center; padding:0.5rem 0;">
                    <p style="font-size:1.05rem; font-weight:600; color:#FDBA74; margin-bottom:0.6rem;">Hello ${guest}!</p>
                    <p style="font-size:0.88rem; color:var(--text-main); line-height:1.5;">We are delighted to host you in <strong>${room}</strong>. Use this digital portal to open gates, request services, check local weather, or message us directly.</p>
                </div>
            `;

            modal.style.display = 'flex';
        }

        // Yzerfontein Specific Attractions & Events Dataset
        const eventData = [
            {
                id: 0,
                title: "16 Mile Beach Coastal Walk",
                spot: "16 Mile Beach, Yzerfontein",
                promoted: true,
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
                desc: "Walk South Africa's longest uninterrupted sandy beach stretching all the way to the West Coast National Park boundary.",
                address: "Main Beach Access, Villa Rd, Yzerfontein, 7351",
                time: "Open Daily • Sunrise to Sunset"
            },
            {
                id: 1,
                title: "Strandkombuis Seafood Feast",
                spot: "Yzerfontein Oceanfront",
                promoted: true,
                image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80",
                desc: "Famous open-air traditional West Coast buffet overlooking the dunes, featuring fresh linefish, snoek, and braai breads.",
                address: "R315, Yzerfontein, 7351",
                time: "Sundays Lunch: 12:00 – 15:30"
            },
            {
                id: 2,
                title: "Buffelsfontein Game Reserve Safari",
                spot: "R27 West Coast Highway",
                promoted: false,
                image: "https://images.unsplash.com/photo-1516426122078-c23e76319801?auto=format&fit=crop&w=800&q=80",
                desc: "Guided 4x4 game drives to view Lion, Cheetah, Rhino, Buffalo, and Giraffe just 15 minutes outside Yzerfontein.",
                address: "R27 Coast Road, Yzerfontein District, 7351",
                time: "Drives at 09:00 & 14:00 Daily"
            },
            {
                id: 3,
                title: "Schaapeiland Coastal Trail",
                spot: "Yzerfontein Main Harbor",
                promoted: false,
                image: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80",
                desc: "2km scenic coastal footpath starting from the main harbor towards Schaapeiland with Atlantic views and rock pools.",
                address: "Yzerfontein Harbor, Lutsenburg Rd, 7351",
                time: "Best at Low Tide • Daylight Hours"
            },
            {
                id: 4,
                title: "Dassen Island Whale & Seabird Spotting",
                spot: "Yzerfontein Point",
                promoted: false,
                image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80",
                desc: "Lookout point for Southern Right Whales (July to November) and views towards Dassen Island Lighthouse offshore.",
                address: "Grotto St Lookout Point, Yzerfontein, 7351",
                time: "Accessible 24/7"
            },
            {
                id: 5,
                title: "West Coast Fossil Park Tour",
                spot: "Langebaan / R27",
                promoted: true,
                image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80",
                desc: "Discover 5-million-year-old fossils of sabre-toothed cats and short-necked giraffes on an underground site tour.",
                address: "R45, Langebaan Road (off R27), 7357",
                time: "Tuesday – Sunday, 09:00 – 15:00"
            }
        ];

        function switchTab(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
        }

        function processCheckIn() {
            const now = new Date();
            const timeString = now.toLocaleDateString() + " at " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            localStorage.setItem('checkinTimestamp', timeString);
            updateCheckInUI(timeString);
            alert(`Check-in logged for ${guestName} (${roomNumber}) at ${timeString}`);
        }

        function updateCheckInUI(timestamp) {
            if(timestamp) {
                document.getElementById('checkinTime').innerText = `Checked In: ${timestamp}`;
                document.getElementById('checkinBtn').innerText = "Logged";
                document.getElementById('checkinBtn').style.background = "#64748B";
            }
        }

        // Fetch Live Weather specifically for Yzerfontein Coordinates (-33.3426, 18.1611)
        async function load7DayWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-33.3426&longitude=18.1611&daily=weathercode,temperature_2m_max,temperature_2m_min,windspeed_10m_max&timezone=Africa%2FJohannesburg');
                const data = await res.json();
                
                let html = '';
                const days = data.daily.time;
                for(let i=0; i<days.length; i++) {
                    const dateObj = new Date(days[i]);
                    const dayName = i === 0 ? "Today" : dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                    const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                    const wind = Math.round(data.daily.windspeed_10m_max[i]);
                    const code = data.daily.weathercode[i];

                    let icon = "☀️ Sunshine";
                    if(code > 2) icon = "⛅ Cloudy";
                    if(code > 50) icon = "🌧️ Rain";

                    html += `
                        <div class="list-card" style="cursor:default;">
                            <div>
                                <strong>${dayName}</strong><br>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${icon}</span>
                            </div>
                            <div style="text-align:right;">
                                <strong>${maxTemp}°C / ${minTemp}°C</strong><br>
                                <span style="font-size:0.75rem; color:var(--text-muted);">💨 ${wind} km/h</span>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('weatherList').innerHTML = html;
            } catch(e) {
                document.getElementById('weatherList').innerHTML = "<p>Weather data currently unavailable.</p>";
            }
        }

        function load7DayEvents() {
            const today = new Date();
            let html = '';
            eventData.forEach((ev, index) => {
                const evDate = new Date();
                evDate.setDate(today.getDate() + index);
                const dateStr = evDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                
                html += `
                    <div class="list-card" onclick="openEventDetail(${ev.id})">
                        <div>
                            <strong>${ev.title}</strong> ${ev.promoted ? '<span class="badge-promoted">Featured</span>' : ''}<br>
                            <span style="font-size:0.75rem; color:var(--text-muted);">📍 ${ev.spot} • ${dateStr}</span>
                        </div>
                        <span style="color:var(--accent); font-weight:700; font-size:0.9rem;">→</span>
                    </div>
                `;
            });
            document.getElementById('eventsList').innerHTML = html;
        }

        function openEventDetail(eventId) {
            const ev = eventData.find(e => e.id === eventId);
            if(!ev) return;

            const modal = document.getElementById('actionModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const submitBtn = document.getElementById('modalSubmitBtn');

            title.innerText = ev.title;
            submitBtn.style.display = "none";

            body.innerHTML = `
                <img src="${ev.image}" class="event-detail-banner" alt="${ev.title}">
                <p style="font-size:0.85rem; color:var(--text-main); margin-bottom:0.8rem; line-height:1.4;">${ev.desc}</p>
                <div style="background:#0F172A; padding:0.8rem; border-radius:10px; border:1px solid var(--border); font-size:0.78rem;">
                    <p style="margin-bottom:0.4rem;">📍 <strong>Address:</strong> ${ev.address}</p>
                    <p>🕒 <strong>Hours / Schedule:</strong> ${ev.time}</p>
                </div>
            `;

            modal.style.display = 'flex';
        }

        function openWhatsApp() {
            window.open(`https://wa.me/${HOST_PHONE}?text=Hi%20Johann,%20I%20am%20${encodeURIComponent(guestName)}%20staying%20in%20${encodeURIComponent(roomNumber)}.`, "_blank");
        }

        function openGateDemo() {
            alert(`Remootio Gate Command Sent for ${guestName} (${roomNumber})!`);
        }

        function openModal(type) {
            const modal = document.getElementById('actionModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const submitBtn = document.getElementById('modalSubmitBtn');
            submitBtn.style.display = "block";

            if(type === 'wifi') {
                title.innerText = "Wi-Fi Credentials";
                body.innerHTML = `
                    <div style="background:#0F172A; padding:1rem; border-radius:10px; border:1px solid var(--border); margin-bottom:1rem;">
                        <p style="font-size:0.85rem; margin-bottom:0.4rem;">Network: <strong>Yzerfontein_Guest_5G</strong></p>
                        <p style="font-size:0.85rem;">Password: <strong id="wifiPass">Welcome2026!</strong></p>
                    </div>
                    <button class="btn-submit" onclick="copyWifi()">📋 Copy Password to Clipboard</button>
                `;
                submitBtn.style.display = "none";
            } else if(type === 'socials') {
                title.innerText = "Our Social Media";
                body.innerHTML = `
                    <a href="https://www.facebook.com/LatskyMultimediagroup/" target="_blank" class="social-link-btn" style="background:#1877F2;">Facebook</a>
                    <a href="https://www.instagram.com/johannlatskyreal/" target="_blank" class="social-link-btn" style="background:#E4405F;">Instagram</a>
                    <a href="https://www.youtube.com/@JohannLatsky" target="_blank" class="social-link-btn" style="background:#FF0000;">YouTube Channel</a>
                `;
                submitBtn.style.display = "none";
            } else if(type === 'breakfast') {
                title.innerText = `Order Breakfast (${roomNumber})`;
                body.innerHTML = `
                    <select id="field1"><option>West Coast Full Breakfast</option><option>Continental Platter</option><option>Vegan Breakfast Bowl</option></select>
                    <input type="time" value="08:30">
                `;
            } else if(type === 'housekeeping') {
                title.innerText = `Housekeeping Request (${roomNumber})`;
                body.innerHTML = `<select><option>Fresh Towels</option><option>Full Room Cleaning</option><option>Extra Pillows</option></select>`;
            } else if(type === 'loadshedding') {
                title.innerText = "Power & Backup Schedule";
                body.innerHTML = `<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">Yzerfontein Substation: <strong>Grid Active (Stage 0)</strong><br>Inverter Backup active for Wi-Fi and Lights.</p>`;
                submitBtn.style.display = "none";
            } else if(type === 'issue') {
                title.innerText = `Report Issue (${roomNumber})`;
                body.innerHTML = `<textarea placeholder="Describe the issue..."></textarea>`;
            } else if(type === 'manual') {
                title.innerText = "House Manual";
                body.innerHTML = `<p style="font-size:0.85rem; color:var(--text-muted);">• Aircon: Use remote on wall bracket.<br>• Coffee Machine: Press top button twice for espresso.<br>• Trash: Bin located near side gate.</p>`;
                submitBtn.style.display = "none";
            } else if(type === 'emergency') {
                title.innerText = "Emergency Numbers";
                body.innerHTML = `<p style="font-size:0.85rem;">• Yzerfontein Armed Response: 022 451 2222<br>• Darling Police Station: 022 492 2314<br>• Medical Ambulance: 10177<br>• Host Direct: +27 82 821 5975</p>`;
                submitBtn.style.display = "none";
            } else if(type === 'checkout') {
                title.innerText = `Express Check-Out (${roomNumber})`;
                body.innerHTML = `<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">Leaving today, ${guestName}? Tap submit to notify host and arrange key drop-off.</p>`;
            }

            modal.style.display = 'flex';
        }

        function copyWifi() {
            navigator.clipboard.writeText("Welcome2026!");
            alert("Password copied to clipboard!");
        }

        function closeModal() { document.getElementById('actionModal').style.display = 'none'; }
        
        function submitRequest() {
            alert(`Request submitted for ${guestName} (${roomNumber})!`);
            closeModal();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            parseURLParameters();
            load7DayWeather();
            load7DayEvents();
            
            const savedCheckIn = localStorage.getItem('checkinTimestamp');
            if(savedCheckIn) updateCheckInUI(savedCheckIn);
        });
    </script>
</body>
</html>
